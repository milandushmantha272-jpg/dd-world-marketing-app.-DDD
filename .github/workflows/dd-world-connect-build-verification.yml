name: DD WORLD CONNECT Final Android Build Verification

on:
  push:
    branches:
      - main
      - feature/dd-world-connect-foundation
      - release/dd-world-connect-v1
      - integration/dd-world-connect-features-clean-2026-11-13
  pull_request:
    branches:
      - main
      - feature/dd-world-connect-foundation
      - release/dd-world-connect-v1
      - integration/dd-world-connect-features-clean-2026-11-13
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-flutter:
    name: Flutter analysis, tests, debug and release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dd_world_connect
    env:
      SUPABASE_URL: https://gbszujosgslsjaiibasa.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_y7AXK7PAs06E66sgfn6aaQ_06WNuS0l
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Restore missing Flutter Android platform
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f android/app/build.gradle && ! -f android/app/build.gradle.kts ]]; then
            echo "Flutter Android platform is missing in dd_world_connect; generating Android scaffold without touching lib/ or pubspec.yaml."
            flutter create --platforms=android --org com.ddworld.marketing --project-name dd_world_connect .
          fi
          test -d android
          test -d android/app
          test -d android/app/src/main
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/settings.gradle || test -f android/settings.gradle.kts
          test -f android/gradle.properties
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          echo "Verified Flutter Android platform files:"
          find android -maxdepth 4 -type f | sort | head -100

      - name: Restore expected Android application ID
        shell: bash
        run: |
          set -euo pipefail
          generated_id="com.ddworld.marketing.dd_world_connect"
          expected_id="com.ddworld.marketing.app"
          if grep -RIl "$generated_id" android/app >/tmp/ddwc-package-files.txt; then
            while IFS= read -r file; do
              sed -i "s/$generated_id/$expected_id/g" "$file"
            done </tmp/ddwc-package-files.txt
          fi
          if grep -RIl "$generated_id" android/app; then
            echo "Generated Android package ID was not fully replaced."
            exit 1
          fi
          grep -R -nE 'namespace|applicationId|^package ' android/app/src/main android/app/build.gradle* || true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      - name: Verify Supabase runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "Missing SUPABASE_URL GitHub secret or variable."; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "Missing SUPABASE_PUBLISHABLE_KEY (or SUPABASE_ANON_KEY) GitHub secret or variable."; exit 1; }

      - name: flutter build apk --debug
        shell: bash
        run: |
          start=$(date +%s)
          flutter build apk --debug --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          end=$(date +%s)
          echo "DEBUG_BUILD_SECONDS=$((end-start))" >> "$GITHUB_ENV"
          test -s build/app/outputs/flutter-apk/app-debug.apk
          ls -lh build/app/outputs/flutter-apk/app-debug.apk

      - name: flutter build apk --release
        shell: bash
        run: |
          start=$(date +%s)
          flutter build apk --release --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          end=$(date +%s)
          echo "RELEASE_BUILD_SECONDS=$((end-start))" >> "$GITHUB_ENV"
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Verify APK application ID
        shell: bash
        run: |
          set -euo pipefail
          build_tools="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools"
          aapt="$(find "$build_tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$aapt" || { echo "Android aapt tool was not found."; exit 1; }
          for apk in build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/app-release.apk; do
            actual="$("$aapt" dump badging "$apk" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")"
            echo "$(basename "$apk"): $actual"
            test "$actual" = "com.ddworld.marketing.app"
          done

      - name: Summarize APK artifacts
        if: always()
        shell: bash
        run: |
          {
            echo "## DD WORLD CONNECT Android build results"
            echo
            for apk in build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/app-release.apk; do
              if [ -s "$apk" ]; then
                size=$(du -h "$apk" | cut -f1)
                bytes=$(stat -c%s "$apk")
                echo "- **$(basename "$apk")**: PASS — $size ($bytes bytes)"
              else
                echo "- **$(basename "$apk")**: FAIL — artifact missing"
              fi
            done
            echo
            echo "- Debug build duration: ${DEBUG_BUILD_SECONDS:-not completed} seconds"
            echo "- Release build duration: ${RELEASE_BUILD_SECONDS:-not completed} seconds"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dd-world-connect-debug-apk
          path: dd_world_connect/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dd-world-connect-release-apk
          path: dd_world_connect/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
