name: DD WORLD CONNECT Build Verification

on:
  push:
    branches:
      - feature/dd-world-connect-foundation
    paths:
      - 'dd_world_connect/**'
      - '.github/workflows/dd-world-connect-build-verification.yml'
  pull_request:
    branches:
      - feature/dd-world-connect-foundation
    paths:
      - 'dd_world_connect/**'
      - '.github/workflows/dd-world-connect-build-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-flutter:
    name: Flutter analyze, tests and debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dd_world_connect
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      - name: flutter build apk --debug
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dd-world-connect-debug-apk
          path: dd_world_connect/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
