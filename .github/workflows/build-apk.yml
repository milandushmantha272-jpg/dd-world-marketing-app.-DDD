name: Build Permanent Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package DD World Enterprise APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npm run build --if-present

      - name: Sync Capacitor Android Assets
        run: |
          npx cap sync android

      - name: Fix Gradle Permission
        run: |
          chmod +x android/gradlew

      - name: Force Override Android Settings & Bypass Errors
        run: |
          echo "android.defaults.buildFeatures.buildconfig=true" >> android/local.properties
          sed -i 's/applicationId .*/applicationId "com.ddworld.marketing.app"/' android/app/build.gradle
          sed -i 's/package=.*/package="com.ddworld.marketing.app"/' android/app/src/main/AndroidManifest.xml

      - name: Build Android Debug APK
        run: |
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dd-world-marketing-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
